<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flutter APK Builder — IDE</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d1117; color: #e6edf3; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: #161b22; border-bottom: 1px solid #30363d;
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header h1 span { color: #58a6ff; }
  button {
    padding: 8px 14px; border-radius: 8px; border: 1px solid #30363d; cursor: pointer;
    background: #21262d; color: #e6edf3; font-size: 13px; font-weight: 600;
  }
  button:hover:not(:disabled) { background: #30363d; }
  button.primary { background: #238636; border-color: #2ea043; }
  button.primary:hover:not(:disabled) { background: #2ea043; }
  button.danger { color: #f85149; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  main { display: grid; grid-template-columns: 280px 1fr; gap: 0; flex: 1; overflow: hidden; }

  /* sidebar */
  aside { background: #0d1117; border-right: 1px solid #30363d; overflow-y: auto; padding: 10px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b949e; margin: 6px 4px; }
  .proj-item, .file-item {
    padding: 7px 10px; border-radius: 7px; font-size: 13.5px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .proj-item:hover, .file-item:hover { background: #161b22; }
  .proj-item.active, .file-item.active { background: #1f2937; color: #58a6ff; }
  .del-btn { opacity: 0; border: none; background: none; color: #f85149; padding: 0 4px; }
  .proj-item:hover .del-btn { opacity: .8; }

  /* editor area */
  section { display: flex; flex-direction: column; overflow: hidden; }
  .editor-head {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-bottom: 1px solid #30363d; background: #161b22;
  }
  #filepath { font-family: monospace; font-size: 13px; color: #8b949e; flex: 1; }
  textarea#editor {
    flex: 1; resize: none; border: 0; outline: 0; padding: 14px;
    background: #0d1117; color: #e6edf3; font-family: 'Fira Code', Consolas, monospace;
    font-size: 13.5px; line-height: 1.55; tab-size: 2; white-space: pre;
  }
  .dirty-dot { color: #e3b341; }

  /* build panel */
  .build-panel { border-top: 1px solid #30363d; background: #161b22; max-height: 40%; display: flex; flex-direction: column; }
  .build-tabs { display: flex; gap: 6px; padding: 8px 14px 0; align-items: center; }
  .bar { flex: 1; height: 7px; background: #21262d; border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: #58a6ff; transition: width .6s; }
  pre#log {
    margin: 8px 14px 12px; padding: 10px; background: #010409; border: 1px solid #21262d;
    border-radius: 8px; overflow: auto; flex: 1; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; min-height: 80px;
  }
  a.dl {
    display: none; margin: 0 14px 12px; text-align: center; padding: 11px; border-radius: 9px;
    background: #1f6feb; color: #fff; font-weight: 600; text-decoration: none;
  }

  /* modal */
  dialog {
    background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 12px;
    padding: 24px; width: 360px;
  }
  dialog::backdrop { background: rgba(1,4,9,.7); }
  dialog input {
    width: 100%; padding: 10px; margin-top: 12px; background: #0d1117; border: 1px solid #30363d;
    border-radius: 8px; color: #e6edf3; font-size: 14px;
  }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .empty { color: #8b949e; padding: 40px; text-align: center; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>📱 Flutter <span>APK Builder</span></h1>
  <button id="newBtn" class="primary">＋ New Project</button>
</header>

<main>
  <aside>
    <h2>Projects</h2>
    <div id="projects"><div class="empty">Loading…</div></div>
    <h2 style="margin-top:14px">Files</h2>
    <div id="files"></div>
  </aside>

  <section>
    <div class="editor-head">
      <span id="filepath">No file selected</span>
      <span id="dirty" class="dirty-dot" style="display:none">● unsaved</span>
      <button id="saveBtn" disabled>💾 Save (Ctrl+S)</button>
      <button id="buildBtn" class="primary" disabled>🔨 Build APK</button>
    </div>
    <textarea id="editor" spellcheck="false" disabled placeholder="Select or create a project, then click a file to edit it."></textarea>

    <div class="build-panel">
      <div class="build-tabs">
        <div class="bar" id="bar"><div id="barfill"></div></div>
        <span id="statusTxt" style="font-size:12.5px;color:#8b949e;white-space:nowrap">idle</span>
      </div>
      <pre id="log">Build output will appear here.</pre>
      <a class="dl" id="dl">⬇️ Download APK</a>
    </div>
  </section>
</main>

<dialog id="dlg">
  <h3 style="margin:0">Create New Project</h3>
  <input id="nameInput" placeholder="app name (lowercase, e.g. my_app)" autofocus>
  <div class="row">
    <button onclick="document.getElementById('dlg').close()">Cancel</button>
    <button id="createBtn" class="primary">Create</button>
  </div>
</dialog>

<script>
const API = "https://princekauz-flutter-apk-builder.hf.space";
const $ = id => document.getElementById(id);
let currentProject = null, currentFile = null, dirty = false;

// ---- projects ----
async function loadProjects() {
  const data = await (await fetch(API + '/api/projects')).json();
  const el = $('projects');
  el.innerHTML = '';
  if (!data.projects.length) el.innerHTML = '<div class="empty">No projects yet — create one!</div>';
  for (const p of data.projects) {
    const div = document.createElement('div');
    div.className = 'proj-item' + (p === currentProject ? ' active' : '');
    div.innerHTML = `<span>${p}</span>`;
    const del = document.createElement('button');
    del.className = 'del-btn'; del.textContent = '✕';
    del.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Delete project "${p}"? This cannot be undone.`)) return;
      await fetch(API + '/api/project/' + p, { method: 'DELETE' });
      if (currentProject === p) { currentProject = null; $('editor').value=''; $('files').innerHTML=''; $('filepath').textContent='No file selected'; $('buildBtn').disabled = true; }
      loadProjects();
    };
    div.appendChild(del);
    div.onclick = () => selectProject(p);
    el.appendChild(div);
  }
}

async function selectProject(p) {
  currentProject = p;
  $('buildBtn').disabled = false;
  $('dl').style.display = 'none';
  await loadProjects();
  await loadFiles();
}

$('newBtn').onclick = () => { $('dlg').showModal(); $('nameInput').focus(); };

$('createBtn').onclick = async () => {
  const name = $('nameInput').value.trim();
  $('createBtn').disabled = true;
  setStatus(`Creating project "${name}"…`, 15);
  try {
    const r = await fetch(API + '/api/projects', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    logLine(`✅ flutter create ${j.project} done.`);
    $('dlg').close(); $('nameInput').value = '';
    await selectProject(j.project);
    // open main.dart by default
    openFile('lib/main.dart');
  } catch (e) {
    logLine('❌ Create failed: ' + e.message); setStatus('error', 0);
  }
  $('createBtn').disabled = false;
};

// ---- files ----
async function loadFiles() {
  if (!currentProject) return;
  const data = await (await fetch(`${API}/api/project/${currentProject}/files`)).json();
  const el = $('files'); el.innerHTML = '';
  for (const f of (data.files || [])) {
    const div = document.createElement('div');
    div.className = 'file-item' + (f === currentFile ? ' active' : '');
    div.textContent = f;
    div.onclick = () => openFile(f);
    el.appendChild(div);
  }
}

async function openFile(path) {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  const r = await fetch(`${API}/api/project/${currentProject}/file?path=${encodeURIComponent(path)}`);
  const j = await r.json();
  if (!r.ok) { alert(j.error); return; }
  currentFile = path;
  $('editor').value = j.content;
  $('editor').disabled = false;
  $('filepath').textContent = `${currentProject}/${path}`;
  setDirty(false);
  loadFiles();
}

$('editor').addEventListener('input', () => setDirty(true));
function setDirty(v) {
  dirty = v;
  $('dirty').style.display = v ? 'inline' : 'none';
  $('saveBtn').disabled = !v || !currentFile;
}
$('saveBtn').onclick = saveFile;
async function saveFile() {
  if (!currentFile) return;
  const r = await fetch(`${API}/api/project/${currentProject}/file?path=${encodeURIComponent(currentFile)}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ content: $('editor').value })
  });
  if (!r.ok) { const j = await r.json().catch(()=>({})); alert('Save failed: ' + (j.error||r.status)); return; }
  setDirty(false); logLine(`💾 Saved ${currentFile}`);
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
});

// ---- build ----
$('buildBtn').onclick = async () => {
  if (dirty && !confirm('You have unsaved changes — build anyway?')) return;
  $('buildBtn').disabled = true; $('dl').style.display = 'none';
  $('log').textContent = '';
  setStatus('queued…', 5);
  try {
    const r = await fetch(`${API}/api/project/${currentProject}/build`, { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    poll(j.job_id);
  } catch (e) { logLine('❌ ' + e.message); setStatus('failed to start', 0); $('buildBtn').disabled = false; }
};

async function poll(jobId) {
  let pct = 15;
  while (true) {
    const s = await (await fetch(`${API}/api/status/${jobId}`)).json();
    if (s.status === 'pub_get')   { pct = Math.max(pct,30); setBar(pct); setStatus('resolving dependencies…', pct); }
    else if (s.status === 'building') { pct = Math.min(pct+6, 90); setBar(pct); setStatus('building APK…', pct); }
    else if (s.status === 'done') {
      setBar(100); setStatus(`done! ${s.size_mb} MB`, 100);
      logLine('✅ Build succeeded.');
      $('dl').href = `${API}/api/download/${jobId}`;
      $('dl').style.display = 'block';
      break;
    } else if (s.status === 'error') {
      setBar(0); setStatus('build failed', 0);
      logLine('❌ Build failed:\n' + (s.log || '?'));
      break;
    }
    await new Promise(r => setTimeout(r, 6000));
  }
  $('buildBtn').disabled = false;
}

// ---- helpers ----
function setBar(p){ $('barfill').style.width = p + '%'; }
function setStatus(t, p){ $('statusTxt').textContent = t; if (p !== undefined) setBar(p); }
function logLine(t){ $('log').textContent += t + '\n'; $('log').scrollTop = 999999; }

loadProjects();
</script>
</body>
</html>
