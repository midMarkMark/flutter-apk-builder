<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Flutter APK Builder</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#238636; --green2:#2ea043; --red:#f85149; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  header {
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--panel); border-bottom:1px solid var(--border);
    padding-top: calc(10px + env(safe-area-inset-top));
  }
  #burger {
    width:42px; height:42px; border:1px solid var(--border); border-radius:10px;
    background:var(--bg); color:var(--text); font-size:19px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  header h1 { font-size:16px; margin:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header h1 span { color:var(--accent); }
  #newBtn {
    padding:10px 14px; border-radius:10px; border:0; cursor:pointer; flex-shrink:0;
    background:var(--green); color:#fff; font-size:13px; font-weight:700;
  }
  #newBtn:active { background:var(--green2); }

  /* ---------- layout ---------- */
  main { flex:1; display:flex; overflow:hidden; position:relative; }

  /* sidebar = drawer on mobile, static on desktop */
  aside {
    position:absolute; inset:0 auto 0 0; width:min(82vw, 300px); z-index:30;
    background:var(--panel); border-right:1px solid var(--border);
    transform:translateX(-100%); transition:transform .25s ease;
    display:flex; flex-direction:column; overflow:hidden;
  }
  aside.open { transform:translateX(0); box-shadow: 8px 0 32px rgba(0,0,0,.6); }
  #scrim {
    position:absolute; inset:0; background:rgba(1,4,9,.6); z-index:20;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #scrim.show { opacity:1; pointer-events:auto; }
  .side-head { display:flex; align-items:center; justify-content:space-between; padding:12px 14px 4px; }
  .side-head h2 { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:0; }
  .side-scroll { flex:1; overflow-y:auto; padding:0 8px 20px; }
  .proj-item, .file-item {
    padding:11px 12px; border-radius:9px; font-size:14px; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    margin-bottom:2px; word-break:break-all;
  }
  .proj-item:active, .file-item:active { background:#21262d; }
  .proj-item.active, .file-item.active { background:#1f2937; color:var(--accent); }
  .del-btn { border:none; background:none; color:var(--red); font-size:15px; padding:4px 6px; flex-shrink:0; }
  .files-label { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:16px 6px 6px; }
  .empty { color:var(--muted); padding:14px 12px; font-size:13px; }

  /* ---------- editor section ---------- */
  section { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
  .editor-head {
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    border-bottom:1px solid var(--border); background:var(--panel);
  }
  #filepath { font-family:monospace; font-size:12px; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .head-btn {
    padding:9px 12px; border-radius:9px; border:1px solid var(--border); cursor:pointer;
    background:#21262d; color:var(--text); font-size:13px; font-weight:600; flex-shrink:0;
  }
  .head-btn:active:not(:disabled) { background:var(--border); }
  .head-btn.primary { background:var(--green); border-color:var(--green2); }
  .head-btn:disabled { opacity:.4; }
  #dirty { color:#e3b341; font-size:12px; flex-shrink:0; display:none; }
  textarea#editor {
    flex:1; resize:none; border:0; outline:0; padding:14px;
    background:var(--bg); color:var(--text);
    font-family:'Fira Code', Consolas, monospace; font-size:14px; line-height:1.55;
    tab-size:2; white-space:pre; overflow:auto;
  }

  /* ---------- build sheet ---------- */
  .build-panel {
    border-top:1px solid var(--border); background:var(--panel);
    max-height:34vh; display:flex; flex-direction:column; flex-shrink:0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .build-tabs { display:flex; gap:10px; padding:10px 14px 0; align-items:center; }
  .bar { flex:1; height:6px; background:#21262d; border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; width:0%; background:var(--accent); transition:width .6s; }
  #statusTxt { font-size:12px; color:var(--muted); white-space:nowrap; }
  pre#log {
    margin:8px 14px 10px; padding:10px; background:#010409; border:1px solid #21262d;
    border-radius:9px; overflow:auto; flex:1; font-size:11.5px; line-height:1.5;
    white-space:pre-wrap; word-break:break-word; min-height:60px;
  }
  a.dl {
    display:none; margin:0 14px 12px; text-align:center; padding:13px; border-radius:10px;
    background:#1f6feb; color:#fff; font-weight:700; text-decoration:none; font-size:15px;
  }

  /* ---------- modal ---------- */
  dialog {
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:14px; padding:22px; width:min(90vw, 380px);
  }
  dialog::backdrop { background:rgba(1,4,9,.7); }
  dialog h3 { margin:0 0 4px; }
  dialog p { margin:0; font-size:13px; color:var(--muted); }
  dialog input {
    width:100%; padding:12px; margin-top:14px; background:var(--bg); border:1px solid var(--border);
    border-radius:9px; color:var(--text); font-size:16px; /* 16px prevents iOS zoom */
  }
  .row { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .row button { padding:11px 18px; border-radius:9px; border:1px solid var(--border); background:#21262d; color:var(--text); font-size:14px; font-weight:600; cursor:pointer; }
  .row button.primary { background:var(--green); border-color:var(--green2); }

  /* ---------- desktop ---------- */
  @media (min-width: 900px) {
    aside { position:static; transform:none; width:280px; box-shadow:none; }
    #scrim { display:none; }
    #burger { display:none; }
    .build-panel { max-height:40%; }
  }
</style>
</head>
<body>
<header>
  <button id="burger" aria-label="Menu">☰</button>
  <h1>📱 Flutter <span>APK Builder</span></h1>
  <button id="newBtn">＋ New</button>
</header>

<main>
  <div id="scrim"></div>
  <aside id="drawer">
    <div class="side-head"><h2>Projects</h2></div>
    <div class="side-scroll">
      <div id="projects"><div class="empty">Loading…</div></div>
      <div class="files-label" id="filesLabel" style="display:none">Files</div>
      <div id="files"></div>
    </div>
  </aside>

  <section>
    <div class="editor-head">
      <span id="filepath">No file selected</span>
      <span id="dirty">● unsaved</span>
      <button id="saveBtn" class="head-btn" disabled>💾 Save</button>
      <button id="buildBtn" class="head-btn primary" disabled>🔨 Build</button>
    </div>
    <textarea id="editor" spellcheck="false" disabled placeholder="Tap ☰ to create or open a project, then pick a file to edit."></textarea>

    <div class="build-panel">
      <div class="build-tabs">
        <div class="bar"><div id="barfill"></div></div>
        <span id="statusTxt">idle</span>
      </div>
      <pre id="log">Build output will appear here.</pre>
      <a class="dl" id="dl">⬇️ Download APK</a>
    </div>
  </section>
</main>

<dialog id="dlg">
  <h3>Create New Project</h3>
  <p>Runs <code>flutter create</code> on the server.</p>
  <input id="nameInput" placeholder="app name (e.g. my_app)" autofocus>
  <div class="row">
    <button onclick="document.getElementById('dlg').close()">Cancel</button>
    <button id="createBtn" class="primary">Create</button>
  </div>
</dialog>

<script>
const API = "https://princekauz-flutter-apk-builder.hf.space";
const $ = id => document.getElementById(id);
let currentProject = null, currentFile = null, dirty = false;

// ---- drawer ----
const drawer = $('drawer'), scrim = $('scrim');
function openDrawer(o) { drawer.classList.toggle('open', o); scrim.classList.toggle('show', o); }
$('burger').onclick = () => openDrawer(!drawer.classList.contains('open'));
scrim.onclick = () => openDrawer(false);

// ---- projects ----
async function loadProjects() {
  const data = await (await fetch(API + '/api/projects')).json();
  const el = $('projects'); el.innerHTML = '';
  if (!data.projects.length) el.innerHTML = '<div class="empty">No projects yet — tap ＋ New.</div>';
  for (const p of data.projects) {
    const div = document.createElement('div');
    div.className = 'proj-item' + (p === currentProject ? ' active' : '');
    const span = document.createElement('span'); span.textContent = p;
    const del = document.createElement('button');
    del.className = 'del-btn'; del.textContent = '✕';
    del.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Delete project "${p}"?`)) return;
      await fetch(API + '/api/project/' + p, { method: 'DELETE' });
      if (currentProject === p) {
        currentProject = null; currentFile = null;
        $('editor').value = ''; $('editor').disabled = true;
        $('files').innerHTML = ''; $('filesLabel').style.display = 'none';
        $('filepath').textContent = 'No file selected'; $('buildBtn').disabled = true;
      }
      loadProjects();
    };
    div.append(span, del);
    div.onclick = () => selectProject(p);
    el.appendChild(div);
  }
}

async function selectProject(p) {
  currentProject = p;
  $('buildBtn').disabled = false;
  $('dl').style.display = 'none';
  $('filesLabel').style.display = 'block';
  await loadProjects();
  await loadFiles();
}

$('newBtn').onclick = () => { openDrawer(false); $('dlg').showModal(); $('nameInput').focus(); };

$('createBtn').onclick = async () => {
  const name = $('nameInput').value.trim();
  if (!name) return;
  $('createBtn').disabled = true;
  setStatus(`creating "${name}"…`, 15);
  try {
    const r = await fetch(API + '/api/projects', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    logLine(`✅ flutter create ${j.project} done.`);
    setStatus('idle', 0);
    $('dlg').close(); $('nameInput').value = '';
    await selectProject(j.project);
    openFile('lib/main.dart');
  } catch (e) {
    logLine('❌ Create failed: ' + e.message); setStatus('error', 0);
  }
  $('createBtn').disabled = false;
};

// ---- files ----
async function loadFiles() {
  if (!currentProject) return;
  const data = await (await fetch(`${API}/api/project/${currentProject}/files`)).json();
  const el = $('files'); el.innerHTML = '';
  for (const f of (data.files || [])) {
    const div = document.createElement('div');
    div.className = 'file-item' + (f === currentFile ? ' active' : '');
    div.textContent = f;
    div.onclick = () => openFile(f);
    el.appendChild(div);
  }
}

async function openFile(path) {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  const r = await fetch(`${API}/api/project/${currentProject}/file?path=${encodeURIComponent(path)}`);
  const j = await r.json();
  if (!r.ok) { alert(j.error); return; }
  currentFile = path;
  $('editor').value = j.content;
  $('editor').disabled = false;
  $('filepath').textContent = `${currentProject}/${path}`;
  setDirty(false);
  openDrawer(false);   // close drawer on mobile after picking a file
  loadFiles();
}

$('editor').addEventListener('input', () => setDirty(true));
function setDirty(v) {
  dirty = v;
  $('dirty').style.display = v ? 'inline' : 'none';
  $('saveBtn').disabled = !v || !currentFile;
}
$('saveBtn').onclick = saveFile;
async function saveFile() {
  if (!currentFile) return;
  const r = await fetch(`${API}/api/project/${currentProject}/file?path=${encodeURIComponent(currentFile)}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ content: $('editor').value })
  });
  if (!r.ok) { const j = await r.json().catch(()=>({})); alert('Save failed: ' + (j.error||r.status)); return; }
  setDirty(false); logLine(`💾 Saved ${currentFile}`);
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveFile(); }
});

// ---- build ----
$('buildBtn').onclick = async () => {
  if (dirty && !confirm('Unsaved changes — build anyway?')) return;
  $('buildBtn').disabled = true; $('dl').style.display = 'none';
  $('log').textContent = '';
  setStatus('queued…', 5);
  try {
    const r = await fetch(`${API}/api/project/${currentProject}/build`, { method: 'POST' });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    poll(j.job_id);
  } catch (e) { logLine('❌ ' + e.message); setStatus('failed to start', 0); $('buildBtn').disabled = false; }
};

async function poll(jobId) {
  let pct = 15;
  while (true) {
    const s = await (await fetch(`${API}/api/status/${jobId}`)).json();
    if (s.status === 'pub_get')       { pct = Math.max(pct,30); setStatus('resolving dependencies…', pct); }
    else if (s.status === 'building') { pct = Math.min(pct+6, 90); setStatus('building APK…', pct); }
    else if (s.status === 'done') {
      setStatus(`done! ${s.size_mb} MB`, 100);
      logLine('✅ Build succeeded.');
      $('dl').href = `${API}/api/download/${jobId}`;
      $('dl').style.display = 'block';
      break;
    } else if (s.status === 'error') {
      setStatus('build failed', 0);
      logLine('❌ Build failed:\n' + (s.log || '?'));
      break;
    }
    await new Promise(r => setTimeout(r, 6000));
  }
  $('buildBtn').disabled = false;
}

// ---- helpers ----
function setBar(p){ $('barfill').style.width = p + '%'; }
function setStatus(t, p){ $('statusTxt').textContent = t; if (p !== undefined) setBar(p); }
function logLine(t){ $('log').textContent += t + '\n'; $('log').scrollTop = 999999; }

loadProjects();
</script>
</body>
</html>
